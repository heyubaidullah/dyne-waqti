<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Waqti mark, monochrome black</title>
  <desc>Single-color black crescent and clock hands, no badge shape, on a transparent background</desc>

  <defs>
    <mask id="crescent-mask-black">
      <rect x="0" y="0" width="400" height="400" fill="white"/>
      <circle cx="247" cy="167" r="92" fill="black"/>
    </mask>
  </defs>

  <circle cx="205" cy="199" r="104" fill="#000000" mask="url(#crescent-mask-black)"/>

  <line x1="217" y1="199" x2="269" y2="153" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
  <line x1="217" y1="199" x2="214" y2="159" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <circle cx="217" cy="199" r="12" fill="#000000"/>
  <circle cx="269" cy="153" r="9" fill="#000000"/>
</svg>
