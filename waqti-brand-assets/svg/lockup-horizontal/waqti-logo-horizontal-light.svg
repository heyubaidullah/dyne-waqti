<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Waqti primary logo, light background</title>
  <desc>Gold crescent icon with a clock-hand accent beside the wordmark Waqti, with a Dyne Labs tagline underneath, on a white background</desc>

  <rect x="0" y="0" width="900" height="320" fill="#FFFFFF"/>

  <g transform="translate(60,60)">
    <rect x="0" y="0" width="200" height="200" rx="44" fill="#0B0F17"/>
    <circle cx="102.5" cy="99.5" r="52" fill="#F59E0B"/>
    <circle cx="123.5" cy="83.5" r="46" fill="#0B0F17"/>
    <line x1="108.5" y1="99.5" x2="134.5" y2="76.5" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <line x1="108.5" y1="99.5" x2="107" y2="79.5" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
    <circle cx="108.5" cy="99.5" r="6" fill="#F59E0B"/>
